<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Letter For You</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3ead8;
      color: #4b3828;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .envelope-wrap { text-align: center; cursor: pointer; }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #e6d5b8;
      border: 1px solid #8b7355;
      border-radius: 6px;
      overflow: hidden;
    }

    .flap {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 60%;
      background: #d9c5a0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .hint {
      margin-top: 18px;
      font-style: italic;
      font-size: 15px;
      color: #8b7355;
    }

    .letter {
      display: none;
      max-width: 600px;
      text-align: center;
      line-height: 1.8;
    }

    .letter.show {
      display: block;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
